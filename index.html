<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body>

	<section>
		<div class="container vh-100">
			<div class="row h-100 align-items-center">
				<div class="col"></div>
				<div class="col">
					<div class="card p-5">
						<form>
						  <div class="mb-3">
						    <label for="exampleInputEmail1" class="form-label">Email address</label>
						    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
						    <div id="emailHelp" class="form-text">We’ll never share your email with anyone else.</div>
						  </div>
						  <div class="mb-3">
							  <label for="password1" class="form-label">Password</label>
							  <input type="password" class="form-control" id="password1" placeholder="Enter password">
							  <div class="strength" data-bs-strength>
							    <div class="strength-segment"></div>
							    <div class="strength-segment"></div>
							    <div class="strength-segment"></div>
							    <div class="strength-segment"></div>
							  </div>
							</div>
						  <div class="mb-3 form-field">
						    <input type="checkbox" id="exampleCheck1" class="check">
						    <label for="exampleCheck1">Check me out</label>
						  </div>
						  <button type="submit" class="btn-solid theme-primary">Submit</button>
						</form>
					</div>
				</div>
				<div class="col"></div>
			</div>
		</div>
	</section>



	<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>

</body>
</html>
